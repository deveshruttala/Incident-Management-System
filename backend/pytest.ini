[pytest]
# pytest-asyncio: every `async def` test is auto-discovered without needing
# an explicit @pytest.mark.asyncio decorator. Function-scope event loop is
# the default; we set it explicitly to silence the upstream deprecation
# warning about its scope changing in a future release.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests

# We don't want noisy library deprecation warnings cluttering test output;
# our own code should never raise these because we pin dependency versions.
filterwarnings =
    ignore::DeprecationWarning
